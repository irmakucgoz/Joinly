{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ baslik|default:"İlan Oluştur" }} — Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar">
    <a href="{% url 'home' %}" class="navbar-logo">
        Joinly<span class="navbar-logo-dot"></span>
    </a>
    <div class="navbar-links">
        <a href="{% url 'home' %}" class="navbar-link">Ana Sayfa</a>
        <a href="{% url 'logout' %}" class="navbar-btn-danger">Çıkış</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card" style="max-width:520px;">
        <div class="auth-logo">
            <a href="{% url 'home' %}" class="auth-logo-text">Joinly</a>
        </div>
        <h2>{{ baslik|default:"🚀 Yeni İlan Oluştur" }}</h2>
        <p class="auth-subtitle">Topluluğa yeni bir duyuru bırak.</p>

        {% for message in messages %}
            <div class="error-msg">{{ message }}</div>
        {% endfor %}

        <form method="POST">
            {% csrf_token %}
            <div style="text-align:left;">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn-auth" style="margin-top:16px;">
                İlanı Yayınla
            </button>
        </form>

        <div class="auth-footer">
            <a href="{% url 'home' %}">← Vazgeç ve Geri Dön</a>
        </div>
    </div>
</div>

</body>
</html>
