{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlanı Sil — Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar">
    <a href="{% url 'home' %}" class="navbar-logo">
        Joinly<span class="navbar-logo-dot"></span>
    </a>
    <div class="navbar-links">
        <a href="{% url 'home' %}" class="navbar-link">Ana Sayfa</a>
        <a href="{% url 'logout' %}" class="navbar-btn-danger">Çıkış</a>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <h2 style="color:var(--red);">⚠️ İlanı Silmek Üzeresin</h2>
        <p class="auth-subtitle">
            <strong>"{{ ilan.title }}"</strong> başlıklı ilanı kalıcı olarak silmek istediğinden emin misin?
        </p>
        <p style="font-size:0.83rem;color:var(--ink-4);margin-bottom:24px;text-align:center;">
            Bu işlem geri alınamaz.
        </p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-auth" style="background:var(--red);box-shadow:0 4px 16px rgba(229,72,77,0.3);">
                Evet, Kalıcı Olarak Sil
            </button>
        </form>
        <div class="auth-footer">
            <a href="{% url 'ilan_detay' ilan.id %}">← Vazgeç ve Geri Dön</a>
        </div>
    </div>
</div>

</body>
</html>
