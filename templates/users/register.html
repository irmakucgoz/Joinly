{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol — Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="{% url 'home' %}" class="auth-logo-text">Joinly</a>
        </div>

        <h2>Topluluğa Katıl</h2>
        <p class="auth-subtitle">Ücretsiz hesap oluştur, hemen başla.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" placeholder="Örn: irmak123" required autocomplete="username">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Adınız</label>
                    <input type="text" name="first_name" placeholder="Irmak" required>
                </div>
                <div class="form-group">
                    <label>Soyadınız</label>
                    <input type="text" name="last_name" placeholder="Yılmaz" required>
                </div>
            </div>

            <div class="form-group">
                <label>E-posta</label>
                <input type="email" name="email" placeholder="irmak@örnek.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" placeholder="En az 8 karakter" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn-auth">Kayıt Ol — Ücretsiz</button>
        </form>

        <div class="auth-footer">
            Zaten hesabın var mı? <a href="{% url 'login' %}">Giriş Yap</a><br>
            <a href="{% url 'home' %}" style="color:var(--ink-4);">← Ana Sayfaya Dön</a>
        </div>
    </div>
</div>

</body>
</html>
