{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Kayıt Ol | Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* Giriş sayfasıyla aynı tarzda olması için bu stilleri ekliyoruz */
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f3f0ff;
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        .auth-card h2 { color: #5d3ebc; margin-bottom: 10px; text-align: center; }
        .auth-card p { text-align: center; color: #666; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-auth {
            background-color: #5d3ebc;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
        .error-msg { background-color: #ffebee; color: #d32f2f; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Joinly'ye Katıl</h2>
            <p>Topluluğun bir parçası olmak için formu doldur.</p>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" name="username" placeholder="Örn: irmak123" required>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;">
                        <label>Adınız</label>
                        <input type="text" name="first_name" placeholder="Irmak" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label>Soyadınız</label>
                        <input type="text" name="last_name" placeholder="Yılmaz" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" name="email" placeholder="irmak@gs.edu.tr" required>
                </div>

                <div class="form-group">
                    <label>Şifre Oluştur</label>
                    <input type="password" name="password" placeholder="En az 8 karakter" required>
                </div>

                <button type="submit" class="btn-auth">Kayıt Ol</button>
            </form>
            
            <div class="auth-footer">
                Zaten hesabın var mı? <a href="{% url 'login' %}" style="color: #5d3ebc; font-weight: bold;">Giriş Yap</a>
                <br><br>
                <a href="{% url 'home' %}" style="text-decoration: none; color: #777;">← Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>
</body>
</html>
