{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap — Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <a href="{% url 'home' %}" class="auth-logo-text">Joinly</a>
        </div>

        <h2>Tekrar hoş geldin</h2>
        <p class="auth-subtitle">Hesabına giriş yap, topluluğa katıl.</p>

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' %}
                    <div class="error-msg">{{ message }}</div>
                {% endif %}
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label>Kullanıcı Adı</label>
                <input type="text" name="username" placeholder="kullanici_adi" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Şifre</label>
                <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-auth">Giriş Yap</button>
        </form>

        <div class="auth-footer">
            Hesabın yok mu? <a href="{% url 'register' %}">Kayıt Ol</a><br>
            <a href="{% url 'home' %}" style="color:var(--ink-4);">← Ana Sayfaya Dön</a>
        </div>
    </div>
</div>

</body>
</html>
