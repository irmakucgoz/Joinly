{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Giriş Yap | Joinly</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        .auth-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f3f0ff;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .auth-card h2 { color: #5d3ebc; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-auth {
            background-color: #5d3ebc;
            color: white;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 10px;
        }
        .auth-footer { text-align: center; margin-top: 20px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Joinly'ye Giriş Yap</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <p style="color: red; text-align: center;">{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn-auth">Giriş Yap</button>
            </form>
            
            <div class="auth-footer">
                Hesabın yok mu? <a href="{% url 'register' %}" style="color: #5d3ebc;">Kayıt Ol</a>
                <br><br>
                <a href="{% url 'home' %}" style="text-decoration: none; color: #777;">← Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>
</body>
</html>
